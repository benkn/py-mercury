# This CI workflow runs on every commit to main and every PR.
# It installs Python 3.12.12 and the project's dev dependencies, then runs lint and tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install --upgrade pip && pip install -e '.[dev]'

      - run: ruff check .

      - run: python -m pytest
